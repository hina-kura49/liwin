# SPDX-License-Identifier: MIT OR Apache-2.0
# Publishes the product page in site/ to GitHub Pages
# (https://hina-kura49.github.io/liwin/). The site is static: no build step,
# the directory is uploaded as is.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the site
        run: |
          test -f site/index.html
          for f in style.css assets/liwin-icon.svg assets/liwin-demo.mp4 assets/liwin-demo-poster.jpg assets/og.png; do
            test -f "site/$f" || { echo "::error::missing site/$f"; exit 1; }
          done

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
