# SPDX-License-Identifier: MIT OR Apache-2.0
# Keeps a release PR open on main (version bump + CHANGELOG.md, see
# release-please-config.json). Merging that PR tags vX.Y.Z, creates the
# GitHub release, and then builds and uploads the release assets.
name: Release Please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Pull requests opened with the default GITHUB_TOKEN do not trigger other
      # workflows (so CI would not run on the release PR). If a GitHub App
      # (vars.RELEASE_PLEASE_APP_ID + secrets.RELEASE_PLEASE_APP_PRIVATE_KEY)
      # or a fine-grained PAT (secrets.RELEASE_PLEASE_TOKEN) is configured,
      # use it instead; otherwise fall back to GITHUB_TOKEN.
      - name: Create GitHub App token
        id: app-token
        if: vars.RELEASE_PLEASE_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Called directly (not via a `release` event), because a release created
  # with GITHUB_TOKEN would not trigger another workflow.
  assets:
    name: Release assets
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
