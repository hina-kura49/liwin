[package]
name = "liwin-daemon"
description = "liwin daemon: window model, layout and D-Bus service"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "liwin-daemon"
path = "src/main.rs"

[dependencies]
liwin-core.workspace = true
zbus = { version = "6.3", default-features = false, features = ["tokio", "proxy", "service", "tracing"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "io-util"] }
futures-util = "0.3"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }
serde = "1"
